data: !dict '{{ "{" }}
  {% for x in range(1, _.maxleadtime.int + 1) %}
  {{ _.dir }}/{{ (cycle + _.delta * x).strftime(_.fmt.gfs) }}: {{ _.bcs.pre }}{{ "%03d" % (x + _.cycles.low.offset) }},
  {% endfor %}
  {{ _.dir }}/{{ (cycle + _.cycles.high.delta).strftime(_.fmt.gfs) }}: {{ _.bcs.pre }}{{ "%03d" % _.cycles.high.offset }},
  {{ _.dir }}/{{ _.cycles.prev.cycle.strftime(_.fmt.hrrr) }}_surface_f01.grib2: {{ _.ics.prev }}.wrfsfcf01.grib2,
  {{ _.dir }}/{{ cycle.strftime(_.fmt.hrrr) }}_pressure.grib2: {{ _.ics.this }}.wrfprsf00.grib2,
  {{ _.dir }}/{{ cycle.strftime(_.fmt.hrrr) }}_surface.grib2: {{ _.ics.this }}.wrfsfcf00.grib2,
  {{ "}" }}'
_:
  bcs:
    pre: '{{ _.bcs.urlbase }}/gfs.{{ _.cycles.low.yyyymmdd }}/{{ _.cycles.low.hh }}/atmos/gfs.t{{ _.cycles.low.hh }}z.pgrb2.0p25.f'
    urlbase: https://noaa-gfs-bdp-pds.s3.amazonaws.com
  cycles:
    high:
      delta: !timedelta '{{ _.cycles.high.synoptic - cycle }}'
      epsilon: !timedelta '{{ 6 - (_.cycles.high.maxvalidtime.hour % 6) }}'
      maxvalidtime: !datetime '{{ cycle + _.maxleadtime.timedelta }}'
      offset: !int '{{ (_.cycles.high.synoptic - _.cycles.low.synoptic).total_seconds() / 3600 }}'
      synoptic: !datetime '{{ _.cycles.high.maxvalidtime + _.cycles.high.epsilon }}'
    low:
      delta: !timedelta '{{ _.cycles.low.offset }}'
      hh: '{{ _.cycles.low.synoptic.strftime("%H") }}'
      offset: !int '{{ cycle.timestamp() % (3600 * 6) / 3600 }}'
      synoptic: !datetime '{{ cycle - _.cycles.low.delta }}'
      yyyymmdd: '{{ _.cycles.low.synoptic.strftime("%Y%m%d") }}'
    prev:
      cycle: !datetime '{{ cycle - _.delta }}'
      hh: '{{ _.cycles.prev.cycle.strftime("%H") }}'
      yyyymmdd: '{{ _.cycles.prev.cycle.strftime("%Y%m%d") }}'
    this:
      hh: '{{ cycle.strftime("%H") }}'
      yyyymmdd: '{{ cycle.strftime("%Y%m%d") }}'
  delta: !timedelta 01:00:00
  dir: '{{ _.cycles.this.yyyymmdd }}/{{ _.cycles.this.hh }}'
  fmt:
    gfs: gfs_%Y%m%d_%H.grib2
    hrrr: hrrr_%Y%m%d_%H
  ics:
    prev: '{{ _.ics.urlbase }}/hrrr.{{ _.cycles.prev.yyyymmdd }}/conus/hrrr.t{{ _.cycles.prev.hh }}z'
    this: '{{ _.ics.urlbase }}/hrrr.{{ _.cycles.this.yyyymmdd }}/conus/hrrr.t{{ _.cycles.this.hh }}z'
    urlbase: https://noaa-hrrr-bdp-pds.s3.amazonaws.com
  maxleadtime:
    int: !int '{{ leadtime.total_seconds() / 3600 }}'
    timedelta: !timedelta '{{ _.maxleadtime.int }}'
