app:
  account: gsd-hpcs
  basedir: /scratch4/BMC/gsd-hpcs/Paul.Madden/HRRRCast-live
  conda: /scratch4/BMC/gsd-hpcs/Paul.Madden/HRRRCast-live/conda
  partitions:
    netaccess: u1-service
data: !dict '{{ "{" }}
  {% for x in range(1, _.maxleadtime.int + 1) %}
  {{ _.dir }}/{{ (cycle + _.td * x).strftime(_.fmt.gfs) }}: {{ _.prefix.bcs }}{{ "%03d" % (x + _.cycles.below.offset) }},
  {% endfor %}
  {{ _.dir }}/{{ _.cycles.above.synoptic.strftime(_.fmt.gfs) }}: {{ _.prefix.bcs }}{{ "%03d" % _.cycles.above.leadtime }},
  {{ _.dir }}/{{ _.cycles.prev.cycle.strftime(_.fmt.hrrr) }}_surface_f01.grib2: {{ _.prefix.ics.prev }}.wrfsfcf01.grib2,
  {{ _.dir }}/{{ cycle.strftime(_.fmt.hrrr) }}_pressure.grib2: {{ _.prefix.ics.this }}.wrfprsf00.grib2,
  {{ _.dir }}/{{ cycle.strftime(_.fmt.hrrr) }}_surface.grib2: {{ _.prefix.ics.this }}.wrfsfcf00.grib2,
  {{ "}" }}'
rocoto:
  workflow:
    attrs:
      realtime: false
      scheduler: slurm
    cycledef:
      - attrs:
          group: this
        spec: '{{ _.cycles.this.yyyymmddhhmm }} {{ _.cycles.this.yyyymmddhhmm }} 01:00:00'
    log:
      value: '{{ _.dir }}/rocoto.log'
    tasks:
      task_data:
        attrs:
          cycledefs: this
        account: '{{ app.account }}'
        command: '{{ _.activate }} && uw fs copy -c {{ _.dir }}/data.yaml --report --threads 4 2>{{ _.dir }}/data.out | jq -e "select(.notready == [])" >{{ _.dir }}/data.json'
        cores: 1
        join: '{{ _.dir }}/data.out'
        partition: '{{ app.partitions.netaccess }}'
        walltime: 00:02:00
_:
  activate: source {{ app.conda }}/etc/profile.d/conda.sh && conda activate hrrrcast
  cycles:
    above:
      hours_before_next_synoptic: !timedelta '{{ (6 - (_.cycles.this.maxvalidtime.hour % 6)) % 6 }}'
      leadtime: !int '{{ (_.cycles.above.synoptic - _.cycles.below.synoptic).total_seconds() / 3600 }}'
      synoptic: !datetime '{{ _.cycles.this.maxvalidtime + _.cycles.above.hours_before_next_synoptic }}'
    below:
      hh: '{{ _.cycles.below.synoptic.strftime("%H") }}'
      offset: !int '{{ cycle.timestamp() % (3600 * 6) / 3600 }}'
      synoptic: !datetime '{{ cycle - _.cycles.below.td }}'
      td: !timedelta '{{ _.cycles.below.offset }}'
      yyyymmdd: '{{ _.cycles.below.synoptic.strftime("%Y%m%d") }}'
    prev:
      cycle: !datetime '{{ cycle - _.td }}'
      hh: '{{ _.cycles.prev.cycle.strftime("%H") }}'
      yyyymmdd: '{{ _.cycles.prev.cycle.strftime("%Y%m%d") }}'
    this:
      hh: '{{ cycle.strftime("%H") }}'
      maxvalidtime: !datetime '{{ cycle + _.maxleadtime.td }}'
      yyyymmdd: '{{ cycle.strftime("%Y%m%d") }}'
      yyyymmddhhmm: '{{ cycle.strftime("%Y%m%d%H%M") }}'
  dir: '{{ app.basedir }}/{{ _.cycles.this.yyyymmdd }}/{{ _.cycles.this.hh }}'
  fmt:
    gfs: gfs_%Y%m%d_%H.grib2
    hrrr: hrrr_%Y%m%d_%H
  maxleadtime:
    int: !int '{{ leadtime.total_seconds() / 3600 }}'
    td: !timedelta '{{ _.maxleadtime.int }}'
  prefix:
    bcs: '{{ _.urlbase.bcs }}/gfs.{{ _.cycles.below.yyyymmdd }}/{{ _.cycles.below.hh }}/atmos/gfs.t{{ _.cycles.below.hh }}z.pgrb2.0p25.f'
    ics:
      prev: '{{ _.urlbase.ics }}/hrrr.{{ _.cycles.prev.yyyymmdd }}/conus/hrrr.t{{ _.cycles.prev.hh }}z'
      this: '{{ _.urlbase.ics }}/hrrr.{{ _.cycles.this.yyyymmdd }}/conus/hrrr.t{{ _.cycles.this.hh }}z'
  td: !timedelta 01:00:00
  urlbase:
    bcs: https://noaa-gfs-bdp-pds.s3.amazonaws.com
    ics: https://noaa-hrrr-bdp-pds.s3.amazonaws.com
